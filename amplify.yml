version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - curl -fsSL https://bun.sh/install | bash
            - export PATH="$HOME/.bun/bin:$PATH"
            - export HUSKY=0
            - export API_INTERNAL_URL="${API_INTERNAL_URL:-$NEXT_PUBLIC_API_ENDPOINT}"
            - bun install --frozen-lockfile --linker hoisted
        build:
          commands:
            - export API_INTERNAL_URL="${API_INTERNAL_URL:-$NEXT_PUBLIC_API_ENDPOINT}"
            - bun run build:web
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/web/.next/cache/**/*
          - .turbo/**/*
