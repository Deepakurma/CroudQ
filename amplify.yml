version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - curl -fsSL https://bun.sh/install | bash
            - export PATH="$HOME/.bun/bin:$PATH"
            - export HUSKY=0
            - bun install --frozen-lockfile --linker hoisted
        build:
          commands:
            - bun run build:web
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
